<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collection — SenExport Boutique</title>
<meta name="theme-color" content="var(--bg)">
<link rel="icon" type="image/png" href="logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="styles-dark.css">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--ink); font-family: var(--ff-b); overflow-x: hidden; padding-top: 56px; }
  img { max-width: 100%; display: block; }
  button { cursor: pointer; -webkit-appearance: none; appearance: none; font-family: inherit; }
  .container { width: 100%; padding: 0 1rem; max-width: 1400px; margin: 0 auto; }

  /* 1. L'OUVERTURE (HERO) */
  .col-hero { height: 90vh; min-height: 600px; display: flex; align-items: center; justify-content: center; text-align: center; position: relative; overflow: hidden; margin-top: -56px; }
  .col-hero-bg { position: absolute; inset: 0; background-size: cover; background-position: center; filter: grayscale(30%) contrast(1.1); z-index: 0; }
  .col-hero-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(0,0,0,0.8)); z-index: 1; }
  .col-hero-content { position: relative; z-index: 3; padding: 2rem; max-width: 800px; }
  .col-badge { font-family: var(--ff-m); font-size: 0.7rem; color: #000; background: var(--or); padding: 0.4rem 1.2rem; border-radius: 99px; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 700; margin-bottom: 1.5rem; display: inline-block; }
  .col-title { font-family: var(--ff-d); font-size: clamp(3rem, 12vw, 6rem); color: #fff; font-weight: 300; line-height: 0.9; text-transform: uppercase; margin-bottom: 1.5rem; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
  .col-title em { color: var(--or); font-style: italic; font-weight: 700; }

  /* 2. LA TENSION (MANIFESTE) */
  .manifesto { padding: 6rem 1rem; text-align: center; border-bottom: 1px solid var(--border); }
  .manifesto-text { font-family: var(--ff-d); font-size: clamp(1.5rem, 4vw, 2.2rem); font-weight: 300; line-height: 1.4; color: var(--ink); max-width: 800px; margin: 0 auto; }
  .manifesto-text em { color: var(--or); font-style: italic; }

  /* 3. LA RÉVÉLATION (PIÈCE HÉROÏNE) */
  .hero-piece { display: grid; grid-template-columns: 1fr; margin: 0; border-bottom: 1px solid var(--border); }
  @media (min-width: 768px) { .hero-piece { grid-template-columns: 1.2fr 1fr; min-height: 80vh; } }
  .hero-piece-img { width: 100%; height: 100%; object-fit: cover; aspect-ratio: 4/5; }
  @media (min-width: 768px) { .hero-piece-img { aspect-ratio: auto; } }
  .hero-piece-content { padding: 4rem 2rem; display: flex; flex-direction: column; justify-content: center; background: var(--bg); }
  .hero-piece-label { font-family: var(--ff-m); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--or); margin-bottom: 1rem; }
  .hero-piece-name { font-family: var(--ff-d); font-size: clamp(2rem, 5vw, 3rem); font-weight: 400; line-height: 1.1; margin-bottom: 1.5rem; }
  .hero-piece-desc { font-size: 1rem; color: var(--stone); line-height: 1.7; margin-bottom: 2rem; max-width: 450px; }
  .hero-piece-footer { display: flex; align-items: center; gap: 2rem; margin-top: auto; flex-wrap: wrap; }
  .hero-piece-prix { font-family: var(--ff-d); font-size: 1.8rem; color: var(--ink); }
  .btn-hero-piece { background: var(--ink); color: var(--bg); padding: 1rem 2rem; text-decoration: none; font-weight: 700; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.1em; border-radius: 4px; transition: 0.2s; border: 1px solid var(--ink); }
  .btn-hero-piece:hover { background: transparent; color: var(--ink); }

  /* 4. L'EXPLORATION (GRILLE) */
  .section-head { display: flex; justify-content: space-between; align-items: flex-end; margin: 4rem auto 2rem; padding: 0 1rem 1rem; border-bottom: 1px solid var(--or-line); max-width: 1400px; }
  .section-head h2 { font-family: var(--ff-d); font-size: 1.8rem; font-weight: 400; color: var(--ink); margin: 0; }
  .section-head h2 em { color: var(--or); font-style: italic; }
  .section-head .meta { font-family: var(--ff-m); font-size: 0.7rem; color: var(--stone); text-transform: uppercase; letter-spacing: 0.1em; }

  .prod-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 1rem 4rem; max-width: 1400px; margin: 0 auto; }
  @media (min-width: 768px) { .prod-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; } }
  .p-card { background: var(--card2); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; position: relative; text-decoration: none; transition: transform 0.3s var(--ease); }
  .p-card:hover { transform: translateY(-5px); }
  .p-image-wrap { aspect-ratio: 4/5; overflow: hidden; background: var(--bg2); display: block; position: relative; }
  .p-image-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
  .p-card:hover .p-image-wrap img { transform: scale(1.05); }
  .p-body { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; background: var(--card2); }
  .p-name { font-size: 0.85rem; color: var(--ink); font-weight: 500; line-height: 1.4; text-decoration: none; }
  .p-prix { font-family: var(--ff-d); font-size: 1.2rem; font-weight: 600; color: var(--or); margin-top: auto; }

  /* 5. L'INSPIRATION (LOOKBOOK) */
  .look-card { display: grid; grid-template-columns: 1fr; margin: 0 1rem 2rem; max-width: 1400px; margin-left: auto; margin-right: auto; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--card); }
  @media (min-width: 768px) { .look-card { grid-template-columns: 1fr 1fr; } .look-card.reverse .look-img { order: 2; } }
  .look-img { height: 400px; background-size: cover; background-position: center; }
  .look-content { padding: 3rem; display: flex; flex-direction: column; justify-content: center; }
  .look-title { font-family: var(--ff-d); font-size: 2rem; color: var(--ink); margin-bottom: 1.5rem; font-weight: 400; }
  .look-title em { color: var(--or); font-style: italic; }
  .look-items { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem; }
  .look-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; background: var(--bg2); border-radius: 4px; text-decoration: none; color: var(--ink); border: 1px solid transparent; }
  .look-item:hover { border-color: var(--or); }
  .look-item span { font-size: 0.9rem; }
  .look-item strong { font-family: var(--ff-m); font-size: 0.8rem; color: var(--or); }
  .look-total { display: flex; justify-content: space-between; font-family: var(--ff-d); font-size: 1.2rem; margin-bottom: 1.5rem; border-top: 1px solid var(--border); padding-top: 1rem; }
  .btn-buy-look { width: 100%; padding: 1.2rem; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; border-radius: 4px; cursor: pointer; transition: 0.2s; background: var(--or); color: #000; border: 1px solid var(--or); }
  .btn-buy-look:hover { background: transparent; color: var(--or); }

  /* 6. LA SUITE (PROCHAIN CHAPITRE) */
  .next-chapter { padding: 6rem 1rem; text-align: center; background: var(--bg2); border-top: 1px solid var(--border); margin-top: 4rem; }
  .next-chapter h2 { font-family: var(--ff-d); font-size: clamp(2rem, 5vw, 3rem); color: var(--ink); margin-bottom: 1rem; font-weight: 400; }
  .next-chapter h2 em { color: var(--or); font-style: italic; }
  .next-chapter p { color: var(--stone); max-width: 500px; margin: 0 auto 2rem; }
  .next-chapter-date { font-family: var(--ff-m); color: var(--or); font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 2rem; display: block; }
  .btn-next { display: inline-block; background: #25D366; color: #fff; padding: 1rem 2rem; text-decoration: none; font-weight: 700; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.1em; border-radius: 4px; transition: 0.2s; }
  .btn-next:hover { background: #1ebe57; transform: translateY(-2px); }

  /* PANIER */
  .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  .drawer-overlay.open { opacity: 1; pointer-events: auto; }
  .cart-drawer { position: fixed; bottom: 0; left: 0; right: 0; height: 85vh; background: var(--bg); border-radius: 20px 20px 0 0; border-top: 1px solid var(--border); transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.4,0,0.2,1); z-index: 10000; display: flex; flex-direction: column; }
  .cart-drawer.open { transform: translateY(0); }
  .drawer-head { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .drawer-head h3 { font-family: var(--ff-d); font-size: 1.4rem; color: var(--ink); }
  .drawer-close { background: none; border: none; color: var(--stone); font-size: 1.5rem; cursor: pointer; }
  .cart-drawer-inner { overflow-y: auto; flex: 1; padding: 1.25rem; }
  .drawer-item { display: flex; gap: 1rem; margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
  .drawer-item img { width: 70px; height: 90px; object-fit: cover; border-radius: 8px; }
  .drawer-item-info { flex: 1; }
  .drawer-item-info h4 { font-size: 0.9rem; color: var(--ink); margin-bottom: 0.25rem; }
  .drawer-item-info p { font-family: var(--ff-m); font-size: 0.85rem; color: var(--or); }
  .drawer-footer { padding: 1.25rem; border-top: 1px solid var(--border); }
  .drawer-total { display: flex; justify-content: space-between; margin-bottom: 1.5rem; font-family: var(--ff-d); font-size: 1.3rem; color: var(--ink); }
  .drawer-btn { display: block; width: 100%; padding: 1rem; background: var(--or); color: #000; text-align: center; text-decoration: none; text-transform: uppercase; font-weight: 700; font-size: 0.85rem; border-radius: 8px; }
  .drawer-empty { text-align: center; color: var(--stone); padding: 3rem 1rem; }
</style>
</head>
<body>

<div class="drawer-overlay" id="drawer-overlay"></div>
<div class="cart-drawer" id="cart-drawer">
  <div class="drawer-head"><h3>Panier</h3><button class="drawer-close" id="drawer-close">×</button></div>
  <div class="cart-drawer-inner" id="drawer-body"><div class="drawer-empty">Votre panier est vide.</div></div>
  <div class="drawer-footer" id="drawer-footer" style="display: none;"><div class="drawer-total"><span>Total</span><span id="drawer-total-val">0 FCFA</span></div><a href="panier.html" class="drawer-btn">Voir le panier</a></div>
</div>

<nav class="nav" id="nav">
  <a href="index.html" class="nav-logo">Sen·Export <em>Boutique</em></a>
  <ul class="nav-links"><li><a href="index.html">Accueil</a></li><li><a href="mode.html">Mode</a></li><li><a href="catalogue.html">Catalogue</a></li></ul>
  <div class="nav-right">
    <a href="panier.html" class="nav-icon" id="nav-cart-icon" aria-label="Panier"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><span class="nav-badge" id="cart-count"></span></a>
  </div>
</nav>

<!-- 1. HERO -->
<div class="col-hero" id="col-hero">
  <div class="col-hero-bg" id="col-hero-bg"></div>
  <div class="col-hero-overlay"></div>
  <div class="col-hero-content">
    <span class="col-badge" id="col-badge">Chargement...</span>
    <h1 class="col-title" id="col-title">Collection</h1>
  </div>
</div>

<!-- Contenu dynamique -->
<div id="dynamic-content"></div>

<footer class="footer" style="margin-top: 4rem;">
  <div class="footer-grid">
    <div class="footer-brand"><div>Sen·Export <em style="color:var(--or); font-style:italic; font-weight:300;">Boutique</em></div><p>Les meilleurs produits sélectionnés pour vous.</p></div>
    <nav class="footer-col"><h4>Boutique</h4><ul><li><a href="mode.html">Mode</a></li></ul></nav>
    <nav class="footer-col"><h4>Contact</h4><ul><li><a href="https://wa.me/221778038874" target="_blank">WhatsApp</a></li></ul></nav>
  </div>
  <div class="footer-bottom"><p>© 2026 SenExport Boutique</p></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="images.js"></script>
<script src="app.js"></script>
<script src="theme.js"></script>

<script>
(() => {
  'use strict';

  function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function fprix(n) { return Math.round(n||0).toLocaleString('fr-FR') + ' FCFA'; }
  function imgUrl(u) {
    if (!u) return 'https://placehold.co/600x800/08090E/D4AF37?text=SenExport';
    if (u.startsWith('http')) return u;
    if (u.startsWith('photo-')) return `https://images.unsplash.com/${u}`;
    return `https://axgpohmhzmdgozndlntj.supabase.co/storage/v1/object/public/photos/${u}`;
  }

  const OUTFITS = [
    { img: 'https://images.unsplash.com/photo-1490481651871-ab68de25d43d?q=80&w=1200&auto=format&fit=crop', titre: 'Le total look <em>Streetwear</em>', refs: ['SW-001', 'SW-002'] }
  ];

  const params = new URLSearchParams(window.location.search);
  const colId = params.get('id');
  const status = params.get('status');
  const dynamicContent = document.getElementById('dynamic-content');

  const drawer = document.getElementById('cart-drawer');
  const overlay = document.getElementById('drawer-overlay');
  const openDrawer = () => { drawer.classList.add('open'); overlay.classList.add('open'); document.body.style.overflow = 'hidden'; };
  const closeDrawer = () => { drawer.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow = ''; };
  overlay.addEventListener('click', closeDrawer);
  document.getElementById('drawer-close').addEventListener('click', closeDrawer);

  function updateDrawer() {
    try {
      const rawItems = SE.Cart.all();
      const body = document.getElementById('drawer-body');
      const footer = document.getElementById('drawer-footer');
      const totalEl = document.getElementById('drawer-total-val');
      if (!rawItems || rawItems.length === 0) { body.innerHTML = '<div class="drawer-empty">Votre panier est vide.</div>'; footer.style.display = 'none'; } 
      else {
        let total = 0;
        body.innerHTML = rawItems.map(i => {
          const a = SE.Articles.cache ? SE.Articles.cache.find(x => x.reference === i.ref) : null;
          const nom = a ? a.nom : i.ref;
          const prix = a ? (a.prix_vente_fcfa || 0) : 0;
          const photo = imgUrl(a && a.photo_url ? a.photo_url : null);
          total += prix * (i.qte || 1);
          return `<div class="drawer-item"><img src="${esc(photo)}" alt="${esc(nom)}"><div class="drawer-item-info"><h4>${esc(nom)}</h4><p>${fprix(prix)}</p></div></div>`;
        }).join('');
        totalEl.textContent = fprix(total);
        footer.style.display = 'block';
      }
    } catch(e) { console.warn('Drawer err', e); }
  }

  function updateUI() {
    try { const n = SE?.Cart?.count?.() ?? 0; const b = document.getElementById('cart-count'); if (b) { b.textContent = n; b.classList.toggle('show', n > 0); } } catch(e) {}
  }

  async function init() {
    await SE.Articles.load();
    const allArts = SE.Articles.cache || [];

    if (status === 'upcoming') {
      document.getElementById('col-hero-bg').style.backgroundImage = `url('https://images.unsplash.com/photo-1549298916-b41d501d3772?q=80&w=2000&auto=format&fit=crop')`;
      document.getElementById('col-badge').textContent = '✦ Prochain Arrivage';
      document.getElementById('col-title').innerHTML = 'Prochain <em>Chapitre</em>';
      dynamicContent.innerHTML = `<div class="next-chapter"><h2>Arrivage <em>Bientôt</em></h2><p>Préparez-vous. Le prochain drop arrive.</p><a href="https://wa.me/221778038874" class="btn-next" target="_blank">Notifiez-moi sur WhatsApp</a></div>`;
      return;
    }

    if (!colId) { location.href = 'mode.html'; return; }

    try {
      const { data: cols } = await SE.sb.from('collections').select('*').eq('id', colId).limit(1);
      if (!cols || cols.length === 0) { location.href = 'mode.html'; return; }
      const col = cols[0];

      document.title = `${esc(col.nom)} — SenExport Boutique`;
      document.getElementById('col-hero-bg').style.backgroundImage = `url('${esc(col.image_url || 'https://placehold.co/1600x900/08090E/D4AF37?text=SenExport')}')`;
      document.getElementById('col-badge').textContent = col.statut === 'en_cours' ? '● Disponible Maintenant' : 'Collection';
      document.getElementById('col-title').innerHTML = esc(col.nom).replace(/(\d{4})/, '<em>$1</em>'); 

      const { data: liens } = await SE.sb.from('collection_articles').select('article_ref').eq('collection_id', col.id);
      let collectionArticles = [];
      if (liens && liens.length > 0) {
        const refs = liens.map(l => l.article_ref);
        const { data: arts } = await SE.sb.from('articles').select('*').in('reference', refs);
        if (arts) collectionArticles = arts;
      }

      // Filtrer les produits pour la grille
      let gridArticles = collectionArticles;
      if (col.statut === 'passee') gridArticles = collectionArticles.filter(a => (a.quantite || 0) > 0);

      // Identifier la pièce héroïne
      const heroArt = col.hero_piece_ref ? collectionArticles.find(a => a.reference === col.hero_piece_ref) : gridArticles[0];
      // Retirer la pièce héroïne de la grille pour éviter la répétition
      if (heroArt) gridArticles = gridArticles.filter(a => a.reference !== heroArt.reference);

      let html = '';

      // 2. LE MANIFESTE
      if (col.story_text) {
        html += `<div class="manifesto"><p class="manifesto-text">${esc(col.story_text)}</p></div>`;
      }

      // 3. LA PIÈCE HÉROÏNE
      if (heroArt) {
        html += `
          <div class="hero-piece">
            <img src="${esc(imgUrl(heroArt.photo_url))}" class="hero-piece-img" alt="${esc(heroArt.nom)}">
            <div class="hero-piece-content">
              <span class="hero-piece-label">La pièce maîtresse</span>
              <h2 class="hero-piece-name">${esc(heroArt.nom)}</h2>
              <p class="hero-piece-desc">${esc(heroArt.description || 'Une pièce centrale de cette collection, pensée dans les moindres détails.')}</p>
              <div class="hero-piece-footer">
                <span class="hero-piece-prix">${fprix(heroArt.prix_vente_fcfa)}</span>
                <a href="produit.html?ref=${esc(heroArt.reference)}" class="btn-hero-piece">Découvrir la pièce</a>
              </div>
            </div>
          </div>
        `;
      }

      // 4. LA GRILLE D'EXPLORATION
      if (gridArticles.length > 0) {
        html += `<div class="section-head"><h2>Le reste du <em>casting</em></h2><span class="meta">${gridArticles.length} pièces</span></div>`;
        html += `<div class="prod-grid">`;
        gridArticles.forEach(a => {
          const prix = a.prix_vente_fcfa || 0;
          const photo = imgUrl(a.photo_url);
          html += `<a href="produit.html?ref=${esc(a.reference)}" class="p-card"><div class="p-image-wrap"><img src="${esc(photo)}" alt="${esc(a.nom)}" loading="lazy"></div><div class="p-body"><span class="p-name">${esc(a.nom)}</span><span class="p-prix">${fprix(prix)}</span></div></a>`;
        });
        html += `</div>`;
      }

      // 5. LE LOOKBOOK
      let lookHTML = `<div class="section-head"><h2>Acheter le <em>look</em></h2></div>`;
      let validOutfits = 0;
      OUTFITS.forEach(o => {
        let itemsHTML = '';
        let totalPrix = 0;
        let validItems = 0;
        o.refs.forEach(ref => {
          const art = allArts.find(a => a.reference === ref);
          if (art) {
            validItems++;
            const prix = art.prix_vente_fcfa || 0;
            totalPrix += prix;
            itemsHTML += `<a href="produit.html?ref=${esc(art.reference)}" class="look-item"><span>${esc(art.nom)}</span><strong>${fprix(prix)}</strong></a>`;
          }
        });
        if (validItems > 0) {
          validOutfits++;
          lookHTML += `<div class="look-card"><div class="look-img" style="background-image:url('${esc(o.img)}')"></div><div class="look-content"><h3 class="look-title">${o.titre}</h3><div class="look-items">${itemsHTML}</div><div class="look-total"><span>Total Look</span><b>${fprix(totalPrix)}</b></div><button class="btn-buy-look" data-refs="${o.refs.join(',')}">Acheter le look complet</button></div></div>`;
        }
      });
      if (validOutfits > 0) html += lookHTML;

      // 6. LE PROCHAIN CHAPITRE
      const { data: nextDrops } = await SE.sb.from('collections').select('*').eq('statut', 'a_venir').limit(1);
      if (nextDrops && nextDrops.length > 0) {
        const nextCol = nextDrops[0];
        const dateStr = nextCol.date_lancement ? new Date(nextCol.date_lancement).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) : 'Prochainement';
        html += `
          <div class="next-chapter">
            <h2>Le prochain <em>chapitre</em> arrive</h2>
            <span class="next-chapter-date">${esc(nextCol.nom)} — ${dateStr}</span>
            <p>${esc(nextCol.description || "Une nouvelle histoire est en cours d'écriture.")}</p>
            <a href="https://wa.me/221778038874?text=Je%20veux%20etre%20informé%20du%20drop%20${encodeURIComponent(nextCol.nom)}" class="btn-next" target="_blank">Être averti·e en avant-première</a>
          </div>
        `;
      } else {
        html += `<div class="next-chapter"><h2>L'aventure <em>continue</em></h2><a href="mode.html" class="btn-next">Retour à la Mode</a></div>`;
      }

      dynamicContent.innerHTML = html;

      // Listeners
      document.querySelectorAll('.btn-buy-look').forEach(btn => {
        btn.addEventListener('click', () => {
          btn.dataset.refs.split(',').forEach(r => SE.Cart.add(r, 1));
          updateUI(); updateDrawer(); setTimeout(openDrawer, 400);
        });
      });

    } catch (e) { console.error('[Collection] Erreur:', e); }
  }

  if (document.readyState === 'complete') init();
  else window.addEventListener('load', init);
})();
</script>
</body>
</html>
